          ifr_model: Managed inference model
          dtwh_deployment: DataWarehouse for Clickhouse deployment
      default: unknown_type
    scaleway.search.v1alpha1.SearchResourcesRequest.OrderBy:
      type: string
      enum:
      - relevance
      - created_at_asc
      - created_at_desc
      - modified_at_asc
      - modified_at_desc
      - name_asc
      - name_desc
      - type_asc
      - type_desc
      x-enum-descriptions:
        values:
          created_at_asc: Sort by creation date in ascending order
          created_at_desc: Sort by creation date in descending order
          modified_at_asc: Sort by modification date in ascending order
          modified_at_desc: Sort by modification date in descending order
          name_asc: Sort by resource name in alphabetical order
          name_desc: Sort by resource name in reverse alphabetical order
          type_asc: Sort by resource type in alphabetical order
          type_desc: Sort by resource type in reverse alphabetical order
      default: relevance
    scaleway.search.v1alpha1.SearchResourcesResponse:
      type: object
      properties:
        resources:
          type: array
          description: Top resources found.
          items:
            $ref: '#/components/schemas/scaleway.search.v1alpha1.Resource'
        next_page_token:
          type: string
          description: |-
            Opaque token to retrieve the next page of results.
            If this string is empty, it means there are no more pages available.
      x-properties-order:
      - resources
      - next_page_token
    scaleway.search.v1alpha1.ServerlessContainersContainerInfo:
      type: object
      properties:
        namespace_id:
          type: string
          description: ID of the Namespace the Serverless Container belongs to.
      x-properties-order:
      - namespace_id
    scaleway.search.v1alpha1.ServerlessFunctionsFunctionInfo:
      type: object
      properties:
        namespace_id:
          type: string
          description: ID of the Namespace the Serverless Function belongs to.
      x-properties-order:
      - namespace_id
    scaleway.search.v1alpha1.ServerlessSqldbBackupInfo:
      type: object
      properties:
        database_id:
          type: string
          description: ID of the Serverless SQL Database the backup belongs to.
      x-properties-order:
      - database_id
    scaleway.search.v1alpha1.VpcPrivateNetworkInfo:
      type: object
      properties:
        vpc_id:
          type: string
          description: ID of the VPC the Private Network belongs to.
      x-properties-order:
      - vpc_id
  securitySchemes:
    scaleway:
      in: header
      name: X-Auth-Token
      type: apiKey
paths:
  /search/v1alpha1/resources:
    get:
      tags:
      - Resources
      operationId: SearchResources
      summary: Search API
      parameters:
      - in: query
        name: query
        description: Search query.
        required: true
        schema:
          type: string
      - in: query
        name: organization_id
        description: ID of the Organization to search in.
        required: true
        schema:
          type: string
      - in: query
        name: project_ids
        description: List of Project IDs to filter the resources by.
        schema:
          type: array
          items:
            type: string
      - in: query
        name: types
        description: List of resource types to filter the resources by.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/scaleway.search.v1alpha1.Resource.Type'
      - in: query
        name: localities
        description: List of scopes (zones, regions, or global) to filter the resources
          by.
        schema:
          type: array
          items:
            type: string
      - in: query
        name: created_after
        description: Filter resources created after this timestamp. (RFC 3339 format)
        schema:
          type: string
          format: date-time
          example: "2022-03-22T12:34:56.123456Z"
      - in: query
        name: created_before
        description: Filter resources created before this timestamp. (RFC 3339 format)
        schema:
          type: string
          format: date-time
          example: "2022-03-22T12:34:56.123456Z"
      - in: query
        name: modified_after
        description: Filter resources modified after this timestamp. (RFC 3339 format)
        schema:
          type: string
          format: date-time
          example: "2022-03-22T12:34:56.123456Z"
      - in: query
        name: modified_before
        description: Filter resources modified before this timestamp. (RFC 3339 format)
        schema:
          type: string
          format: date-time
          example: "2022-03-22T12:34:56.123456Z"
      - in: query
        name: page_token
        description: |-
          Opaque token used to retrieve the next page of results (cursor-based pagination).
          Leave empty or omit to fetch the first page.
        schema:
          type: string
      - in: query
        name: page_size
        description: Number of resources to retrieve per page.
        schema:
          type: integer
          format: uint32
      - in: query
        name: order_by
        description: Sort order in the response.
        schema:
          $ref: '#/components/schemas/scaleway.search.v1alpha1.SearchResourcesRequest.OrderBy'
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/scaleway.search.v1alpha1.SearchResourcesResponse'
      security:
      - scaleway: []
      x-codeSamples:
      - lang: cURL
        source: |-
          curl -X GET \
            -H "X-Auth-Token: $SCW_SECRET_KEY" \
            "https://api.scaleway.com/search/v1alpha1/resources?organization_id=string&query=string"
      - lang: HTTPie
        source: |-
          http GET "https://api.scaleway.com/search/v1alpha1/resources" \
            X-Auth-Token:$SCW_SECRET_KEY \
            organization_id==string \
            query==string
