openapi: 3.1.0
info:
  title: Web Hosting FTP Account API
  description: |-
    Scaleway provides several Web Hosting plans for individuals, professionals, and everyone in between. Our Web Hosting plans include:

    - A domain name
    - A configurable webhosting service
    - The management of your emails, including anti-spam, antivirus and filter systems
    - Unlimited sub-domains
    - An FTP account to upload your website
    - At least one database

    ## Concepts

    Refer to our [dedicated concepts page](https://www.scaleway.com/en/docs/managed-services/webhosting/concepts/) to find definitions of all Web Hosting-related terminology.

    ## Quickstart

    1. Configure your environment variables.

       <Message type="note">
       This is an optional step that seeks to simplify your usage of the Web Hosting API.
       </Message>

        ```bash
        export SCW_SECRET_KEY="<API secret key>"
        export SCW_PROJECT_ID="<Scaleway Project ID>"
        ```

    2. **Choose a Web Hosting offer**: run the following command to list all Web Hosting offers. The `| jq` appendage at the end of the command makes the output easier to read.

        ```bash
        curl -X GET \
            -H "X-Auth-Token: $SCW_SECRET_KEY" \
            -H "Content-Type: application/json" \
            "https://api.scaleway.com/webhosting/v1/regions/fr-par/offers?without_options=true" | jq
        ```

       <Message type="note">
       In the above example, we choose to get offers only. Adjust the query parameter if you would also like to get information about the different options you can add to offers.
       </Message>

    3. **Order a Web Hosting plan**: run the following command to create a Web Hosting plan. You can customize the details in the payload to your needs, using the table below to help.

        ```bash
        curl -X POST \
            -H "X-Auth-Token: $SCW_SECRET_KEY" \
            -H "Content-Type: application/json" \
            "https://api.scaleway.com/webhosting/v1/regions/fr-par/hostings" \
            -d '{
            "domain": "mydomain.net",
            "offer_id": "f5c2ae8f-7625-4bca-b711-b44bb3d08694",
            "project_id": "'"$SCW_PROJECT_ID"'",
            "tags": ["my-tag"]
        }'
        ```

       | Parameter        | Description                                                                            | Valid values OR Example     |
       |------------------|----------------------------------------------------------------------------------------|-----------------------------|
       | `domain`         | The domain name you would like to link to your Web Hosting account. You must already own this domain name and have completed the DNS validation process beforehand.                                                            | `mydomain.net`               |
       | `offer_id`       | The offer ID of the desired offer. Use one of the offer IDs returned in step 2         |`f5c2ae8f-7625-4bca-b711-b44bb3d08694` |
       | `project_id`     | The ID of the Scaleway Project to create the Web Hosting plan in.                      | `277ed74e-ea73-11ed-a05b-0242ac120003`                   |
       | `tags`           | Any tags you would like to associate with this Web Hosting plan                         | `my-tag`                   |

       <Message type="tip">
       Once you've ordered your Web Hosting plan, check out our [dedicated documentation](https://www.scaleway.com/en/docs/managed-services/webhosting/quickstart/) to get started with your configuration.
       </Message>

    4. **Delete your Web Hosting plan**: run the following command to delete your Web Hosting plan. Ensure that you replace `{hosting-id}` in the URL with the ID of the Web Hosting plan you want to delete.

        ```bash
        curl -X DELETE \
            -H "Content-Type: application/json" \
            -H "X-Auth-Token: $SCW_SECRET_KEY" \
            "https://api.scaleway.com/rest-of-endpoint/{hosting-id}"
        ```

    <Message type="requirement">
    - You have a [Scaleway account](https://console.scaleway.com/)
    - You have created an [API key](https://www.scaleway.com/en/docs/iam/how-to/create-api-keys/) and that the API key has sufficient [IAM permissions](https://www.scaleway.com/en/docs/iam/reference-content/permission-sets/) to perform the actions described on this page
    - You have [installed `curl`](https://curl.se/download.html)
    - You have [installaed `jq`](https://stedolan.github.io/jq/download/)
    </Message>

    ## Technical information

    All Scaleway Web Hosting plans now offer a choice between cPanel and Plesk for website management. Both tools provide a graphical interface and fast access icons, allowing you to configure and monitor your hosting solutions with ease. You can access cPanel or Plesk via the [Scaleway console](https://www.scaleway.com/en/docs/managed-services/webhosting/quickstart/#how-to-access-the-web-hosting-control-panel-from-the-scaleway-console).

    ### Regions

    The Scaleway Web Hosting API is a **regional** API, meaning that each call must specify in its path parameters the region for the resources concerned by the call.

    Scaleway Web Hosting is available only in the `fr-par` region.

    ## Going further

    For more help using Scaleway Web Hosting, check out the following resources:

    - Our [main documentation](https://www.scaleway.com/en/docs/managed-services/webhosting/)
    - The #webhosting-early-access channel on our [Slack Community](https://www.scaleway.com/en/docs/tutorials/scaleway-slack-community/)
    - Our [support ticketing system](https://www.scaleway.com/en/docs/account/how-to/open-a-support-ticket/).
  version: v1
servers:
- url: https://api.scaleway.com
tags:
- name: FTP Accounts
  description: |
    FTP accounts represent the access credentials for FTP (File Transfer Protocol) used to manage files on your web hosting plan.
components:
  schemas:
    scaleway.webhosting.v1.FtpAccount:
      type: object
      properties:
        username:
          type: string
          description: The username of the FTP account.
        path:
          type: string
          description: The path associated with the FTP account.
      x-properties-order:
      - username
      - path
    scaleway.webhosting.v1.ListFtpAccountsRequest.OrderBy:
      type: string
      enum:
      - username_asc
      - username_desc
      default: username_asc
    scaleway.webhosting.v1.ListFtpAccountsResponse:
      type: object
      properties:
        total_count:
          type: integer
          description: Total number of FTP accounts.
          format: uint64
        ftp_accounts:
          type: array
          description: List of FTP accounts.
          items:
            $ref: '#/components/schemas/scaleway.webhosting.v1.FtpAccount'
      x-properties-order:
      - total_count
      - ftp_accounts
  securitySchemes:
    scaleway:
      in: header
      name: X-Auth-Token
      type: apiKey
paths:
  /webhosting/v1/regions/{region}/hostings/{hosting_id}/ftp-accounts:
    get:
      tags:
      - FTP Accounts
      operationId: ListFtpAccounts
      summary: List all FTP accounts within your hosting plan.
      parameters:
      - in: path
        name: region
        description: The region you want to target
        required: true
        schema:
          type: string
          enum:
          - fr-par
          - nl-ams
          - pl-waw
      - in: path
        name: hosting_id
        description: UUID of the hosting plan.
        required: true
        schema:
          type: string
      - in: query
        name: page
        description: Page number (must be a positive integer).
        schema:
          type: integer
          format: int32
      - in: query
        name: page_size
        description: Number of FTP accounts to return (must be a positive integer
          lower or equal to 100).
        schema:
          type: integer
          format: uint32
      - in: query
        name: order_by
        description: Sort order of FTP accounts in the response.
        schema:
          $ref: '#/components/schemas/scaleway.webhosting.v1.ListFtpAccountsRequest.OrderBy'
      - in: query
        name: domain
        description: Domain to filter the FTP accounts.
        schema:
          type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/scaleway.webhosting.v1.ListFtpAccountsResponse'
      security:
      - scaleway: []
      x-codeSamples:
      - lang: cURL
        source: |-
          curl -X GET \
            -H "X-Auth-Token: $SCW_SECRET_KEY" \
            "https://api.scaleway.com/webhosting/v1/regions/{region}/hostings/{hosting_id}/ftp-accounts"
      - lang: HTTPie
        source: |-
          http GET "https://api.scaleway.com/webhosting/v1/regions/{region}/hostings/{hosting_id}/ftp-accounts" \
            X-Auth-Token:$SCW_SECRET_KEY
    post:
      tags:
      - FTP Accounts
      operationId: CreateFtpAccount
      summary: Create a new FTP account within your hosting plan.
      parameters:
      - in: path
        name: region
        description: The region you want to target
        required: true
        schema:
          type: string
          enum:
          - fr-par
          - nl-ams
          - pl-waw
      - in: path
        name: hosting_id
        description: UUID of the hosting plan.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/scaleway.webhosting.v1.FtpAccount'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: Username for the new FTP account.
                path:
                  type: string
                  description: Path for the new FTP account.
                password:
                  type: string
                  description: Password for the new FTP account.
              x-properties-order:
              - username
              - path
              - password
      security:
      - scaleway: []
      x-codeSamples:
      - lang: cURL
        source: |-
          curl -X POST \
            -H "X-Auth-Token: $SCW_SECRET_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "password": "string",
              "path": "string",
              "username": "string"
            }' \
            "https://api.scaleway.com/webhosting/v1/regions/{region}/hostings/{hosting_id}/ftp-accounts"
      - lang: HTTPie
        source: |-
          http POST "https://api.scaleway.com/webhosting/v1/regions/{region}/hostings/{hosting_id}/ftp-accounts" \
            X-Auth-Token:$SCW_SECRET_KEY \
            password="string" \
            path="string" \
            username="string"
  /webhosting/v1/regions/{region}/hostings/{hosting_id}/ftp-accounts/{username}:
    delete:
      tags:
      - FTP Accounts
      operationId: RemoveFtpAccount
      summary: Delete a specific FTP account within your hosting plan.
      parameters:
      - in: path
        name: region
        description: The region you want to target
        required: true
        schema:
          type: string
          enum:
          - fr-par
          - nl-ams
          - pl-waw
      - in: path
        name: hosting_id
        description: UUID of the hosting plan.
        required: true
        schema:
          type: string
      - in: path
        name: username
        description: Username of the FTP account to be deleted.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/scaleway.webhosting.v1.FtpAccount'
      security:
      - scaleway: []
      x-codeSamples:
      - lang: cURL
        source: |-
          curl -X DELETE \
            -H "X-Auth-Token: $SCW_SECRET_KEY" \
            "https://api.scaleway.com/webhosting/v1/regions/{region}/hostings/{hosting_id}/ftp-accounts/{username}"
      - lang: HTTPie
        source: |-
          http DELETE "https://api.scaleway.com/webhosting/v1/regions/{region}/hostings/{hosting_id}/ftp-accounts/{username}" \
            X-Auth-Token:$SCW_SECRET_KEY
  /webhosting/v1/regions/{region}/hostings/{hosting_id}/ftp-accounts/{username}/change-password:
    post:
      operationId: ChangeFtpAccountPassword
      parameters:
      - in: path
        name: region
        description: The region you want to target
        required: true
        schema:
          type: string
          enum:
          - fr-par
          - nl-ams
          - pl-waw
      - in: path
        name: hosting_id
        description: UUID of the hosting plan.
        required: true
        schema:
          type: string
      - in: path
        name: username
        description: Username of the FTP account.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/scaleway.webhosting.v1.FtpAccount'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  description: New password for the FTP account.
              x-properties-order:
              - password
      security:
      - scaleway: []
      x-codeSamples:
      - lang: cURL
        source: |-
          curl -X POST \
            -H "X-Auth-Token: $SCW_SECRET_KEY" \
            -H "Content-Type: application/json" \
            -d '{"password":"string"}' \
            "https://api.scaleway.com/webhosting/v1/regions/{region}/hostings/{hosting_id}/ftp-accounts/{username}/change-password"
      - lang: HTTPie
        source: |-
          http POST "https://api.scaleway.com/webhosting/v1/regions/{region}/hostings/{hosting_id}/ftp-accounts/{username}/change-password" \
            X-Auth-Token:$SCW_SECRET_KEY \
            password="string"
