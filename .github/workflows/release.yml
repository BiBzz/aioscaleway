name: Release

on:
  push:
    tags: ["v*"]

env:
  UV_FROZEN: "1"

jobs:
  release:
    runs-on: ubuntu-latest

    # PyPI trusts this workflow over OIDC, so no token is stored; the pypi
    # environment waits for a reviewer, since an upload cannot be taken back
    environment:
      name: pypi
      url: https://pypi.org/project/aioscaleway/

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.4"
          enable-cache: true

      - name: Check the tag matches the declared version
        run: test "v$(uv version --short)" = "$GITHUB_REF_NAME"

      - name: Install the project
        run: uv sync

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Check the generated code matches the specs
        run: |
          uv run python scripts/generate.py
          git diff --exit-code -- src docs

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest -q

      - name: Build
        run: uv build

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
