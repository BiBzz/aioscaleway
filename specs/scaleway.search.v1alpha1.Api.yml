      type: string
      enum:
      - unknown_type
      - instance_server
      - instance_volume
      - instance_image
      - instance_security_group
      - instance_private_nic
      - instance_snapshot
      - instance_placement_group
      - instance_template
      - k8s_cluster
      - k8s_pool
      - k8s_node
      - domain_domain
      - dns_zone
      - vpc_private_network
      - vpc_vpc
      - vpg_gateway
      - apple_silicon_server
      - rdb_instance
      - rdb_snapshot
      - rdb_backup
      - baremetal_server
      - tem_domain
      - lb_server
      - serverless_functions_function
      - serverless_containers_container
      - serverless_containers_namespace
      - serverless_containers_domain
      - serverless_containers_trigger
      - wbh_hosting
      - redis_cluster
      - sm_secret
      - kms_key
      - edg_pipeline
      - mnq_nats_account
      - sbs_volume
      - sbs_snapshot
      - serverless_job_definition
      - serverless_sqldb_database
      - serverless_sqldb_backup
      - datalab
      - mgdb_instance
      - mgdb_snapshot
      - ifr_deployment
      - ifr_model
      - gapi_batch
      - dtwh_deployment
      - obs_datasource
      - obs_exporter
      - svpn_vpn_gateway
      - svpn_customer_gateway
      - svpn_connection
      - svpn_routing_policy
      - kafk_cluster
      - sedb_cluster
      - autoscaling_group
      - wofl_definition
      - wofl_run
      - kvdb_instance
      - kvdb_snapshot
      x-enum-descriptions:
        values:
          unknown_type: Unknown type
          instance_server: Instance server
          instance_volume: Instance volume
          instance_image: Instance image
          k8s_cluster: K8S cluster
          k8s_pool: K8S pool
          k8s_node: K8S node
          domain_domain: Domain
          dns_zone: DNS zone
          vpc_private_network: VPC private network
          vpc_vpc: VPC
          vpg_gateway: VPG
          apple_silicon_server: Apple Silicon server
          rdb_instance: RDB instance
          rdb_snapshot: RDB snapshot
          rdb_backup: RDB backup
          baremetal_server: Baremetal server
          lb_server: LB server
          serverless_functions_function: Serverless functions function
          serverless_containers_container: Serverless containers container
          wbh_hosting: Web Hosting
