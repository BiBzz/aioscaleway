name: Pull request

on:
  pull_request:
    branches: [development]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.4"
          enable-cache: true

      - name: Install the project
        run: uv sync

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Check the generated code matches the specs
        run: |
          uv run python scripts/generate.py
          git diff --exit-code -- src docs

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest -q

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.4"
          enable-cache: true

      - name: Build the documentation site
        run: |
          uv sync --group docs
          uv run zensical build --clean
