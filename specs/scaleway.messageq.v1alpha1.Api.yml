openapi: 3.1.0
info:
  title: MessageQ API
  description: |-
    Cloud Essentials for RabbitMQ is Scaleway's product to provide a managed infrastructure for your RabbitMQ deployment.

    ## Concepts

    Refer to our [dedicated concepts page](https://www.scaleway.com/en/docs/rabbitmq/concepts/) to find definitions of the different terms referring to key building blocks of RabbitMQ.

    ## Quickstart

    1. **Create a deployment**: Run the following command to create a deployment of three nodes with 5 GB of storage per node and a public endpoint.

    ```bash
        curl -X POST \
          -H "X-Auth-Token: $SCW_SECRET_KEY" \
          -H "Content-Type: application/json" \
          -d '{
            "project_id": $SCW_PROJECT_ID,
            "name":"deployment-1",
            "tags":[],
            "node_amount":1,
            "node_type":"MESSAGEQ-DEDICATED2-2C-8G",
            "user_name":"awesomeUser",
            "password":"MyAwesomeSecureP@ssword1",
            "volume":{
                "type":"sbs_5k",
                "size_bytes":5000000000
            },
            "endpoints": [{"public": {}}],
            "version":"2.0"
            }' \
          "https://api.scaleway.com/messageq/v1alpha1/regions/fr-par/deployments"

    ```

    2. **Get a list of your deployments**: Run the following command to get a list of all the clusters in your account, with their details:

    ```bash
        curl -X GET \
          -H "Content-Type: application/json" \
          -H "X-Auth-Token: $SCW_SECRET_KEY" \
          "https://api.scaleway.com/messageq/v1alpha1/regions/fr-par/deployments"
    ```

    3. **Delete your deployment**: Run the following command to delete a cluster. Ensure that you replace `{resource-id}` in the URL with the ID of the cluster you want to delete.

    ```bash
        curl -X DELETE \
          -H "Content-Type: application/json" \
          -H "X-Auth-Token: $SCW_SECRET_KEY" \
          "https://api.scaleway.com/messageq/v1alpha1/regions/fr-par/deployments/{resource-id}"
    ```

    ## Technical information

    ### Regions

    Scaleway's infrastructure spans different [regions and Availability Zones](https://www.scaleway.com/en/docs/account/reference-content/products-availability/).

    Cloud Essentials for RabbitMQ is currently available in the Paris region, which is represented by the following path parameter:

    - `fr-par`

    ## Going further

    For more information about Cloud Essentials for RabbitMQ, you can check out the following pages:

    - [Cloud Essentials for RabbitMQ documentation](https://www.scaleway.com/en/docs/rabbitmq/)
    - [Contact our Support team](https://console.scaleway.com/support/tickets).
  version: v1alpha1
servers:
- url: https://api.scaleway.com
tags:
- name: Cloud Essentials for RabbitMQ
  description: Manage your RabbitMQ engine
components:
  schemas:
    scaleway.messageq.v1alpha1.Deployment:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the deployment. (UUID format)
          example: 6170692e-7363-616c-6577-61792e636f6d
        name:
          type: string
          description: Name of the deployment.
        organization_id:
          type: string
          description: ID of the Organization containing the deployment. (UUID format)
          example: 6170692e-7363-616c-6577-61792e636f6d
        project_id:
          type: string
          description: ID of the Project containing the deployment. (UUID format)
          example: 6170692e-7363-616c-6577-61792e636f6d
        status:
          description: Status of the deployment.
          $ref: '#/components/schemas/scaleway.messageq.v1alpha1.Deployment.Status'
        tags:
          type: array
          description: Tags of the deployment.
          items:
            type: string
        node_count:
          type: integer
          description: Number of nodes.
          format: uint32
        node_type:
          type: string
          description: Node type used.
        volume:
          description: Volume type and size.
          $ref: '#/components/schemas/scaleway.messageq.v1alpha1.Volume'
        endpoints:
          type: array
          description: Exposed endpoints.
          items:
            $ref: '#/components/schemas/scaleway.messageq.v1alpha1.Endpoint'
        created_at:
          type:
          - string
          - "null"
          description: Date the deployment was created. (RFC 3339 format)
          format: date-time
          example: "2022-03-22T12:34:56.123456Z"
        updated_at:
          type:
          - string
          - "null"
          description: Date the deployment was last updated. (RFC 3339 format)
          format: date-time
          example: "2022-03-22T12:34:56.123456Z"
        version:
          type: string
          description: MessageQ version of the deployment.
        region:
          type: string
          description: Region of the deployment.
        srn:
          type: string
          description: The SRN of the deployment.
          pattern: ^srn://messageq\.[^/]+/regions/[^/]+/deployments/[^/]+$
      x-properties-order:
      - id
      - name
      - organization_id
      - project_id
      - status
      - tags
      - node_count
      - node_type
      - volume
      - endpoints
      - created_at
      - updated_at
      - version
      - region
      - srn
    scaleway.messageq.v1alpha1.Deployment.Status:
      type: string
      enum:
      - unknown_status
      - ready
      - creating
      - initializing
      - upgrading
      - deleting
      - error
      - locked
      - locking
      - unlocking
      default: unknown_status
    scaleway.messageq.v1alpha1.Endpoint:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the endpoint. (UUID format)
          example: 6170692e-7363-616c-6577-61792e636f6d
        dns_record:
          type: string
          description: DNS record for service access. Now deprecated. Use the `url`
            field from `services` field instead.
          deprecated: true
        services:
          type: array
          description: List of available services, their ports and URLs.
          items:
            $ref: '#/components/schemas/scaleway.messageq.v1alpha1.Endpoint.Service'
        region:
          type: string
          description: Region of the endpoint.
        srn:
          type: string
          description: The SRN of the endpoint.
          pattern: ^srn://messageq\.[^/]+/regions/[^/]+/endpoints/[^/]+$
        public:
          description: Precisely one of public, private_network can be set.
          x-one-of: details
          oneOf:
          - $ref: '#/components/schemas/scaleway.messageq.v1alpha1.Endpoint.PublicDetails'
          - type: "null"
        private_network:
          description: Precisely one of public, private_network can be set.
          x-one-of: details
          oneOf:
          - $ref: '#/components/schemas/scaleway.messageq.v1alpha1.Endpoint.PrivateNetworkDetails'
          - type: "null"
      x-properties-order:
      - id
      - dns_record
      - services
      - region
      - srn
      - public
      - private_network
    scaleway.messageq.v1alpha1.Endpoint.PrivateNetworkDetails:
      type: object
      properties:
        private_network_id:
          type: string
          description: (UUID format)
          example: 6170692e-7363-616c-6577-61792e636f6d
      x-properties-order:
      - private_network_id
    scaleway.messageq.v1alpha1.Endpoint.PublicDetails:
      type: object
    scaleway.messageq.v1alpha1.Endpoint.Service:
      type: object
      properties:
        name:
          type: string
        port:
          type: integer
          format: uint32
        url:
          type: string
      x-properties-order:
      - name
      - port
      - url
    scaleway.messageq.v1alpha1.EndpointSpec:
      type: object
      properties:
        public:
          description: Precisely one of public, private_network can be set.
          x-one-of: details
          oneOf:
          - $ref: '#/components/schemas/scaleway.messageq.v1alpha1.EndpointSpec.PublicDetails'
          - type: "null"
        private_network:
          description: Precisely one of public, private_network can be set.
          x-one-of: details
          oneOf:
          - $ref: '#/components/schemas/scaleway.messageq.v1alpha1.EndpointSpec.PrivateNetworkDetails'
          - type: "null"
      x-properties-order:
      - public
      - private_network
    scaleway.messageq.v1alpha1.EndpointSpec.PrivateNetworkDetails:
      type: object
      properties:
        private_network_id:
          type: string
      x-properties-order:
      - private_network_id
    scaleway.messageq.v1alpha1.EndpointSpec.PublicDetails:
      type: object
    scaleway.messageq.v1alpha1.ListDeploymentsRequest.OrderBy:
      type: string
      enum:
      - created_at_asc
      - created_at_desc
      - name_asc
      - name_desc
      - updated_at_asc
      - updated_at_desc
      default: created_at_asc
    scaleway.messageq.v1alpha1.ListDeploymentsResponse:
      type: object
      properties:
        deployments:
          type: array
          description: List of deployments.
          items:
            $ref: '#/components/schemas/scaleway.messageq.v1alpha1.Deployment'
        total_count:
          type: integer
          description: Number of deployments in result set.
          format: uint64
      x-properties-order:
      - deployments
      - total_count
    scaleway.messageq.v1alpha1.ListNodeTypesRequest.OrderBy:
      type: string
      enum:
      - name_asc
      - name_desc
      - vcpus_asc
      - vcpus_desc
      - memory_asc
      - memory_desc
      default: name_asc
    scaleway.messageq.v1alpha1.ListNodeTypesResponse:
      type: object
      properties:
        node_types:
          type: array
          description: List of node types compatible.
          items:
            $ref: '#/components/schemas/scaleway.messageq.v1alpha1.NodeType'
        total_count:
          type: integer
          description: Number of node types in result set.
          format: uint64
      x-properties-order:
      - node_types
      - total_count
    scaleway.messageq.v1alpha1.ListUsersRequest.OrderBy:
      type: string
      enum:
      - name_asc
      - name_desc
      default: name_asc
    scaleway.messageq.v1alpha1.ListUsersResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/scaleway.messageq.v1alpha1.User'
        total_count:
          type: integer
          format: uint64
      x-properties-order:
      - users
      - total_count
    scaleway.messageq.v1alpha1.ListVersionsRequest.OrderBy:
      type: string
      enum:
      - version_asc
      - version_desc
      default: version_asc
    scaleway.messageq.v1alpha1.ListVersionsResponse:
      type: object
      properties:
        versions:
          type: array
          description: List of versions.
          items:
            $ref: '#/components/schemas/scaleway.messageq.v1alpha1.Version'
        total_count:
          type: integer
          description: Number of versions in result set.
          format: uint64
      x-properties-order:
      - versions
      - total_count
    scaleway.messageq.v1alpha1.NodeType:
      type: object
      properties:
        stock_status:
          description: Stock status for the node type.
          $ref: '#/components/schemas/scaleway.messageq.v1alpha1.NodeType.StockStatus'
        name:
          type: string
          description: Name of the node type.
        description:
          type: string
          description: Description of the node type.
        vcpus:
          type: integer
          description: Number of vCPUs available.
          format: uint32
        memory_bytes:
          type: integer
          description: Amount of memory available. (in bytes)
          format: uint64
        disabled:
          type: boolean
          description: Defines whether the node type is disabled.
        beta:
          type: boolean
          description: Defines whether the node type is in beta.
        instance_range:
          type: string
          description: Instance range associated with the node type offer.
        available_volume_types:
          type: array
          description: Available storage options for the node type.
          items:
            $ref: '#/components/schemas/scaleway.messageq.v1alpha1.NodeType.VolumeType'
        region:
          type: string
          description: Region of the node type.
        srn:
          type: string
          description: The SRN of the node type.
          pattern: ^srn://messageq\.[^/]+/regions/[^/]+/node-types/[^/]+$
      x-properties-order:
      - stock_status
      - name
      - description
      - vcpus
      - memory_bytes
      - disabled
      - beta
      - instance_range
      - available_volume_types
      - region
      - srn
    scaleway.messageq.v1alpha1.NodeType.StockStatus:
      type: string
      enum:
      - unknown_stock
      - low_stock
      - out_of_stock
      - available
      default: unknown_stock
    scaleway.messageq.v1alpha1.NodeType.VolumeType:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/scaleway.messageq.v1alpha1.Volume.Type'
        description:
          type: string
        min_size_bytes:
          type: integer
          description: (in bytes)
          format: uint64
        max_size_bytes:
          type: integer
          description: (in bytes)
          format: uint64
        chunk_size_bytes:
          type: integer
          description: (in bytes)
          format: uint64
      x-properties-order:
      - type
      - description
      - min_size_bytes
      - max_size_bytes
      - chunk_size_bytes
    scaleway.messageq.v1alpha1.User:
      type: object
      properties:
        username:
          type: string
          description: Username of the deployment user.
        deployment_id:
          type: string
          description: ID of the deployment.
        region:
          type: string
          description: Region of the user.
        srn:
          type: string
          description: The SRN of the user.
          pattern: ^srn://messageq\.[^/]+/regions/[^/]+/deployments/[^/]+/users/[^/]+$
      x-properties-order:
      - username
      - deployment_id
      - region
      - srn
    scaleway.messageq.v1alpha1.Version:
      type: object
      properties:
        version:
          type: string
          description: MessageQ version.
        end_of_life:
          type:
          - string
          - "null"
          description: Date the version support ends. (RFC 3339 format)
          format: date-time
          example: "2022-03-22T12:34:56.123456Z"
        disabled:
          type: boolean
          description: Defines whether the version is disabled.
        beta:
          type: boolean
          description: Defines whether the version is in beta.
        region:
          type: string
          description: Region of the version.
        srn:
          type: string
          description: The SRN of the version.
          pattern: ^srn://messageq\.[^/]+/regions/[^/]+/versions/[^/]+$
      x-properties-order:
      - version
      - end_of_life
      - disabled
      - beta
      - region
      - srn
    scaleway.messageq.v1alpha1.Volume:
      type: object
      properties:
        type:
          description: Type of the Volume.
          $ref: '#/components/schemas/scaleway.messageq.v1alpha1.Volume.Type'
        size_bytes:
          type: integer
          description: Size of the Volume. (in bytes)
          format: uint64
      x-properties-order:
      - type
      - size_bytes
    scaleway.messageq.v1alpha1.Volume.Type:
      type: string
      enum:
      - unknown_type
      - sbs_5k
      - sbs_15k
      default: unknown_type
    scaleway.std.File:
      type: object
      properties:
        name:
          type: string
        content_type:
          type: string
        content:
          type: string
      x-properties-order:
      - name
      - content_type
      - content
  securitySchemes:
    scaleway:
      in: header
      name: X-Auth-Token
      type: apiKey
paths:
  /messageq/v1alpha1/regions/{region}/deployments:
    get:
      tags:
      - Cloud Essentials for RabbitMQ
      operationId: ListDeployments
      summary: Retrieve a list of MessageQ deployments
      parameters:
      - in: path
        name: region
        description: The region you want to target
        required: true
        schema:
          type: string
          enum:
          - fr-par
      - in: query
        name: organization_id
        description: Organization ID to filter for, only deployments from this Organization
          will be returned.
        schema:
          type: string
      - in: query
        name: project_id
        description: Project ID to filter for, only deployments from this Project
          will be returned.
        schema:
          type: string
      - in: query
        name: order_by
        description: Sort order for deployments in the response.
        schema:
          $ref: '#/components/schemas/scaleway.messageq.v1alpha1.ListDeploymentsRequest.OrderBy'
      - in: query
        name: page
        description: Page number to return, from the paginated results.
        schema:
          type: integer
          format: int32
      - in: query
        name: page_size
        description: Number of deployments to return per page.
        schema:
          type: integer
          format: uint32
      - in: query
        name: tags
        description: Tags to filter for, only deployments with one or more matching
          tags will be returned.
        schema:
          type: array
          items:
            type: string
      - in: query
        name: name
        description: Deployment name to filter for, only deployments with this string
          within their name will be returned.
        schema:
          type: string
          pattern: ^[A-Za-z0-9\-_]+$
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/scaleway.messageq.v1alpha1.ListDeploymentsResponse'
      security:
      - scaleway: []
      x-codeSamples:
      - lang: cURL
        source: |-
          curl -X GET \
            -H "X-Auth-Token: $SCW_SECRET_KEY" \
            "https://api.scaleway.com/messageq/v1alpha1/regions/{region}/deployments"
      - lang: HTTPie
        source: |-
          http GET "https://api.scaleway.com/messageq/v1alpha1/regions/{region}/deployments" \
            X-Auth-Token:$SCW_SECRET_KEY
    post:
      tags:
      - Cloud Essentials for RabbitMQ
      operationId: CreateDeployment
      summary: Create a new MessageQ deployment
      parameters:
      - in: path
        name: region
        description: The region you want to target
        required: true
        schema:
          type: string
          enum:
          - fr-par
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/scaleway.messageq.v1alpha1.Deployment'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                project_id:
                  type: string
                  description: Project ID in which to create the deployment.
                name:
                  type: string
                  description: Name of the deployment.
                  pattern: ^[A-Za-z0-9\-_]+$
                tags:
                  type: array
                  description: Tags.
                  items:
                    type: string
                    pattern: ^[0-9A-Za-z_\-=]+$
                node_count:
                  type: integer
                  description: Number of nodes.
                  format: uint32
                node_type:
                  type: string
                  description: Node type to use.
                  pattern: ^[A-Za-z0-9\-_]+$
                user_name:
                  type:
                  - string
                  - "null"
                  description: Username for the deployment user.
                  pattern: ^[a-zA-Z0-9_$-]*$
                password:
                  type:
                  - string
                  - "null"
                  description: Password for the deployment user.
                volume:
                  description: Volume for storing data.
                  $ref: '#/components/schemas/scaleway.messageq.v1alpha1.Volume'
                endpoints:
                  type: array
                  description: Endpoints to access the deployment.
                  items:
                    $ref: '#/components/schemas/scaleway.messageq.v1alpha1.EndpointSpec'
                version:
                  type: string
                  description: The MessageQ version to use.
                  pattern: ^[0-9]+\.[0-9]+$
              x-properties-order:
              - project_id
              - name
              - tags
              - node_count
              - node_type
              - user_name
              - password
              - volume
              - endpoints
              - version
      security:
      - scaleway: []
      x-codeSamples:
      - lang: cURL
        source: |-
          curl -X POST \
            -H "X-Auth-Token: $SCW_SECRET_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "name": "string",
              "node_count": 42,
              "node_type": "string",
              "project_id": "string",
              "version": "string"
            }' \
            "https://api.scaleway.com/messageq/v1alpha1/regions/{region}/deployments"
      - lang: HTTPie
        source: |-
          http POST "https://api.scaleway.com/messageq/v1alpha1/regions/{region}/deployments" \
            X-Auth-Token:$SCW_SECRET_KEY \
            name="string" \
            node_count:=42 \
            node_type="string" \
            project_id="string" \
            version="string"
  /messageq/v1alpha1/regions/{region}/deployments/{deployment_id}:
    get:
      tags:
      - Cloud Essentials for RabbitMQ
      operationId: GetDeployment
      summary: Retrieve a specific MessageQ deployment
      parameters:
      - in: path
        name: region
        description: The region you want to target
        required: true
        schema:
          type: string
          enum:
          - fr-par
      - in: path
        name: deployment_id
        description: ID of the deployment.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/scaleway.messageq.v1alpha1.Deployment'
      security:
      - scaleway: []
      x-codeSamples:
      - lang: cURL
        source: |-
          curl -X GET \
            -H "X-Auth-Token: $SCW_SECRET_KEY" \
            "https://api.scaleway.com/messageq/v1alpha1/regions/{region}/deployments/{deployment_id}"
      - lang: HTTPie
        source: |-
          http GET "https://api.scaleway.com/messageq/v1alpha1/regions/{region}/deployments/{deployment_id}" \
            X-Auth-Token:$SCW_SECRET_KEY
    patch:
      tags:
      - Cloud Essentials for RabbitMQ
      operationId: UpdateDeployment
      summary: Update a MessageQ deployment
      parameters:
      - in: path
        name: region
        description: The region you want to target
        required: true
        schema:
          type: string
          enum:
          - fr-par
      - in: path
        name: deployment_id
        description: ID of the deployment. (UUID format)
        required: true
        schema:
          type: string
          example: 6170692e-7363-616c-6577-61792e636f6d
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/scaleway.messageq.v1alpha1.Deployment'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type:
                  - string
                  - "null"
                  description: New name for the deployment.
                tags:
                  type:
                  - array
                  - "null"
                  description: Tags to update.
              x-properties-order:
              - name
              - tags
      security:
      - scaleway: []
      x-codeSamples:
      - lang: cURL
        source: |-
          curl -X PATCH \
            -H "X-Auth-Token: $SCW_SECRET_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "https://api.scaleway.com/messageq/v1alpha1/regions/{region}/deployments/{deployment_id}"
      - lang: HTTPie
        source: |-
          http PATCH "https://api.scaleway.com/messageq/v1alpha1/regions/{region}/deployments/{deployment_id}" \
            X-Auth-Token:$SCW_SECRET_KEY
    delete:
      tags:
      - Cloud Essentials for RabbitMQ
      operationId: DeleteDeployment
      summary: Delete a MessageQ deployment
      parameters:
      - in: path
        name: region
        description: The region you want to target
        required: true
        schema:
          type: string
          enum:
          - fr-par
      - in: path
        name: deployment_id
        description: ID of the deployment.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/scaleway.messageq.v1alpha1.Deployment'
      security:
      - scaleway: []
      x-codeSamples:
      - lang: cURL
        source: |-
          curl -X DELETE \
            -H "X-Auth-Token: $SCW_SECRET_KEY" \
            "https://api.scaleway.com/messageq/v1alpha1/regions/{region}/deployments/{deployment_id}"
      - lang: HTTPie
        source: |-
