      - lang: cURL
        source: |-
          curl -X POST \
            -H "X-Auth-Token: $SCW_SECRET_KEY" \
            -H "Content-Type: application/json" \
            -d '{"username":"string"}' \
            "https://api.scaleway.com/webhosting/v1/regions/{region}/hostings/{hosting_id}/databases/{database_name}/assign-user"
      - lang: HTTPie
