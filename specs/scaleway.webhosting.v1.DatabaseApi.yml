      tags:
      - Database Users
      operationId: AssignDatabaseUser
      summary: '"Assign a database user to a database"'
      parameters:
      - in: path
        name: region
        description: The region you want to target
        required: true
        schema:
          type: string
          enum:
          - fr-par
          - nl-ams
          - pl-waw
      - in: path
        name: hosting_id
        description: UUID of the hosting plan.
        required: true
        schema:
          type: string
      - in: path
        name: database_name
        description: Name of the database to be assigned.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
